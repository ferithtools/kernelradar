[workspace]
members = [
    "crates/kernelradar-core",
    "crates/kernelradar-cli",
    "crates/kernelradar-detectors",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Ferith Tools"]
license      = "GPL-2.0-only"
repository   = "https://github.com/ferithtools/kernelradar"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# BPF userspace loading
aya        = { version = "0.13", features = ["async_tokio"] }
aya-log    = "0.2"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-journald   = "0.3"

# UUID v7 for correlation IDs (timestamp-prefixed)
uuid = { version = "1", features = ["v4", "serde"] }

# Errors
anyhow  = "1"
thiserror = "1"

# Regex - allowlist matching.
regex = "1"

# HTTP client for webhook output.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto       = "thin"
strip     = "debuginfo"
